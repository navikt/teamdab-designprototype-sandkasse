name: Publish gh-pages

on:
    push:
        branches:
            - main
    workflow_dispatch:

env:
    CI: true
    TZ: Europe/Oslo

permissions:
    contents: write

jobs:
    build-and-deploy:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version: 22

            - name: Install dependencies
              run: npm ci

            - name: Build
              run: npm run build:gh-pages

            - name: Deploy
              if: success()
              uses: crazy-max/ghaction-github-pages@v4
              with:
                  jekyll: false
                  build_dir: out
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
